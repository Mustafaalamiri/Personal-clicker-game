<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Logic tests</title></head>
<body>
<h1>Logic tests</h1>
<ul id="out"></ul>
<script type="module">
import * as L from '../js/logic.js';
const out = document.getElementById('out');
let failed = 0;
function test(name, cond) {
  const li = document.createElement('li');
  li.textContent = (cond ? 'PASS: ' : 'FAIL: ') + name;
  li.style.color = cond ? 'green' : 'red';
  if (!cond) failed++;
  out.appendChild(li);
}
const lvl = { enemyBaseHp: 10, hpGrowth: 2, goldBase: 3, goldGrowth: 2, killsBeforeBoss: 10, bossHpMultiplier: 8, bossGoldMultiplier: 10 };
const up = { baseCost: 10, costGrowth: 2, perLevel: 1 };

test('first enemy has base HP', L.enemyHp(lvl, 0) === 10);
test('enemy HP grows with index', L.enemyHp(lvl, 2) === 40);
test('gold reward grows with index', L.goldReward(lvl, 1) === 6);
test('upgrade cost at 0 owned = base cost', L.upgradeCost(up, 0) === 10);
test('upgrade cost scales', L.upgradeCost(up, 3) === 80);
test('click damage adds upgrade bonus', L.clickDamage(1, up, 4) === 5);
test('idle dps is 0 with no upgrades', L.idleDps(up, 0) === 0);
test('damage reduces HP', L.applyDamage(10, 3) === 7);
test('HP never goes below 0', L.applyDamage(5, 100) === 0);
test('0 HP is dead', L.isDead(0) === true);
test('positive HP is alive', L.isDead(0.1) === false);
test('can afford exact cost', L.canAfford(10, 10) === true);
test('cannot afford if short', L.canAfford(9, 10) === false);

// Boss and progression
test('boss HP = enemy HP x multiplier', L.bossHp(lvl, 0) === 80);
test('boss gold = reward x multiplier', L.bossGold(lvl, 0) === 30);
test('boss not spawned before kill target', L.shouldSpawnBoss(9, lvl) === false);
test('boss spawns at kill target', L.shouldSpawnBoss(10, lvl) === true);
test('timer counts down', L.tickTimer(10, 2.5) === 7.5);
test('timer never negative', L.tickTimer(1, 5) === 0);
test('time is up at 0', L.isTimeUp(0) === true);
test('time not up above 0', L.isTimeUp(0.1) === false);
test('beating boss on level 1 unlocks level 2', L.unlockedAfterBoss(1, 0, 3) === 2);
test('unlock count never decreases', L.unlockedAfterBoss(3, 0, 3) === 3);
test('unlock count capped at total levels', L.unlockedAfterBoss(3, 2, 3) === 3);

test('mechanic damage multiplies base damage', L.mechanicDamage(3, 8) === 24);
test('multiplier of 1 leaves damage unchanged', L.mechanicDamage(5, 1) === 5);

const A = { x: 0, y: 0 }, B = { x: 10, y: 0 };
test('progress at midpoint is 0.5', L.segmentProgress({ x: 5, y: 0 }, A, B) === 0.5);
test('progress clamps to 0 before start', L.segmentProgress({ x: -5, y: 0 }, A, B) === 0);
test('progress clamps to 1 past the end', L.segmentProgress({ x: 20, y: 0 }, A, B) === 1);
test('zero-length segment gives progress 0', L.segmentProgress({ x: 3, y: 3 }, A, A) === 0);
test('distance to line is perpendicular distance', L.distanceToSegment({ x: 5, y: 3 }, A, B) === 3);
test('distance past the end uses the endpoint', L.distanceToSegment({ x: 13, y: 4 }, A, B) === 5);
test('drag multiplier scales with progress', L.dragMultiplier(12, 0.5) === 6);
test('drag multiplier caps at full value', L.dragMultiplier(12, 2) === 12);

test('drag below 10% counts as nothing', L.dragEffectiveProgress(0.05) === 0);
test('drag at 50% counts as 50%', L.dragEffectiveProgress(0.5) === 0.5);
test('drag at 90% counts as complete', L.dragEffectiveProgress(0.9) === 1);
test('tier none below minimum', L.dragTier(0.05) === 'none');
test('tier low for a short drag', L.dragTier(0.3) === 'low');
test('tier mid for a long drag', L.dragTier(0.7) === 'mid');
test('tier full near the end', L.dragTier(0.95) === 'full');

const s = document.createElement('h2');
s.textContent = failed === 0 ? 'All tests passed' : failed + ' test(s) failed';
document.body.appendChild(s);
</script>
</body></html>
